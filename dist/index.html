  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #0D0D0D;
      --border: #1F1F1F;
      --text: #F5F5F0;
      --muted: #888880;
      --accent: #FF8C42;
      --green: #4ade80;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Satoshi', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      cursor: none;
    }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; }

    /* ── Custom Cursor ── */
    #custom-cursor {
      pointer-events: none;
      position: fixed;
      z-index: 9999;
      border-radius: 50%;
      background: var(--text);
      mix-blend-mode: difference;
      will-change: transform, width, height;
      transition:
        width 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        height 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        margin 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.2s;
    }

    /* ── Scroll Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .delay-1 { transition-delay: 0.08s; }
    .delay-2 { transition-delay: 0.16s; }
    .delay-3 { transition-delay: 0.24s; }
    .delay-4 { transition-delay: 0.32s; }

    /* ── Section fade-out (active section sharp; others blur+dim) ── */
    .section-fade {
      transition: opacity 0.6s ease, filter 0.6s ease;
      will-change: opacity, filter;
    }
    .section-fade.section-dim {
      opacity: 0.18;
      filter: blur(6px);
    }
    @media (prefers-reduced-motion: reduce) {
      .section-fade.section-dim { opacity: 1; filter: none; }
    }

    /* ── Availability pulse ── */
    @keyframes avail-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.55); }
      60%       { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    }
    .avail-dot { animation: avail-pulse 2.6s ease-in-out infinite; }

    /* ── Typewriter caret ── */
    @keyframes caret-blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .type-caret {
      display: inline-block;
      margin-left: 0.04em;
      color: var(--accent);
      animation: caret-blink 0.85s step-end infinite;
      font-weight: 300;
    }

    /* ── Scroll bounce ── */
    @keyframes scroll-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(9px); opacity: 1; }
    }
    .scroll-bounce { animation: scroll-bounce 1.9s ease-in-out infinite; }

    /* ── Marquee ── */
    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee-track {
      animation: marquee-scroll 38s linear infinite;
      display: flex;
      width: max-content;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* ── Nav glitch ── */
    .nav-link { position: relative; display: inline-block; text-decoration: none; }
    .nav-link .ghost {
      position: absolute; top: 0; left: 2px;
      color: var(--accent); opacity: 0;
      pointer-events: none; white-space: nowrap;
      transition: opacity 0.15s;
    }
    .nav-link:hover .ghost { opacity: 0.55; }

    /* ── Typography helpers ── */
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;

    /* ── Striped placeholder ── */

    /* ── Project rows ── */
    .project-row {
      border-top: 1px solid var(--border);
      transition: background 0.3s;
      position: relative;
    }
    .project-row:last-child { border-bottom: 1px solid var(--border); }
    .project-row:hover { background: rgba(var(--accent-rgb, 255,140,66), 0.025); }
    .proj-num  { transition: color 0.3s; }

    .project-row:hover .proj-num  { color: var(--accent); }
    .project-row:hover .proj-name { color: var(--accent); }

    /* ── Services card hover ── */
    .svc-card {

      border-radius: 2px;
    }
    .svc-card:hover { border-color: var(--accent); }

    /* ── Contact email ── */
    .contact-email { transition: color 0.2s; }
    .contact-email:hover { color: var(--accent) !important; }

    /* ── Social links ── */
    .social-link {
      color: var(--muted); text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .social-link:hover { color: var(--text); border-color: var(--text); }

    /* ── Grain texture overlay (global background; behind everything) ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: var(--grain-opacity, 0);
      background-image: var(--grain-image, none);
      background-size: var(--grain-size, 180px) var(--grain-size, 180px);
      mix-blend-mode: overlay;
    }
    /* Hero photo sits above the grain */
    .hero-photo-wrap { z-index: 2; }
    /* Real content above the grain */
    nav, section, footer, #root > div { position: relative; }

    /* ── Liquid Glass — applied to specific blocks when body.lg-on ── */
    body.lg-on .svc-card,

      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.04) 100%) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-color: rgba(255,255,255,0.1) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.2),
        0 8px 32px rgba(0,0,0,0.35) !important;
    }

    /* ── Liquid Glass effect (legacy class, still available) ── */
    .liquid-glass {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.06) 0%,
        rgba(255,255,255,0.02) 50%,
        rgba(255,255,255,0.04) 100%
      ) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08) !important;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.2),
        0 8px 32px rgba(0,0,0,0.35) !important;
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        120% 100% at 0% 0%,
        rgba(var(--accent-rgb, 255,140,66), 0.08) 0%,
        transparent 60%
      );
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* ── Lineicons sizing helper ── */
    .li-icon {
      font-size: 1.1rem;

    }

    /* ── Touch / coarse pointer: disable custom cursor ── */
    @media (pointer: coarse) {

    /* ── Splash / Intro overlay ── */
    #splash {
      position: fixed;

    #lottie-container {

    #lottie-container svg path,

  <!-- Lottie player (loaded synchronously so it's ready before DOMContentLoaded) -->
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>

  <script>
    (function () {
      var VISIT_KEY = 'hk_visited';
      var splash = document.getElementById('splash');

      // Returning visitor → skip the intro entirely
      var hasVisited = false;
      try { hasVisited = localStorage.getItem(VISIT_KEY) === '1'; } catch (e) {}
      if (hasVisited) {
        if (splash) splash.style.display = 'none';
        return;
      }

      var animDone = false;
      var siteDone = false;
      var anim = null;

      function tryReveal() {
        if (!animDone || !siteDone) return;
        splash.addEventListener('transitionend', function () {
          splash.style.display = 'none';
        }, { once: true });
        splash.classList.add('fade-out');
        try { localStorage.setItem(VISIT_KEY, '1'); } catch (e) {}
      }

      // Flag: site fully loaded (all resources)
      window.addEventListener('load', function () {
        siteDone = true;
        // If animation already finished and is frozen on last frame → reveal now
        tryReveal();
      });

      // Start Lottie once DOM is ready
      document.addEventListener('DOMContentLoaded', function () {
        anim = lottie.loadAnimation({
          container: document.getElementById('lottie-container'),
          renderer: 'svg',
          loop: false,
          autoplay: true,
          path: 'assets/logo-intro.json'
        });

        anim.addEventListener('complete', function () {
          animDone = true;
          // Freeze on last frame automatically (loop:false keeps it there)
          tryReveal();
        });
      });
    })();
  </script>
